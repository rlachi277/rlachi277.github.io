<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="/vibing/assets/favicon.png">
	<title>Vibing Chat</title>
	<link rel="stylesheet" href="./style.css">
	<script type="module" src="./app.js"></script>
</head>
<body>
	<main class="chat-shell">
		<section class="chat-panel" aria-label="Chat room">
			<header class="chat-header">
				<div class="room-title">
					<a class="back-link" href="../">Back to vibing/</a>
					<h1>Vibing Chat</h1>
					<p id="connection-status">Connecting...</p>
				</div>
				<div class="profile-pill" aria-label="Current session">
					<span id="profile-avatar" class="avatar" aria-hidden="true"></span>
					<span id="profile-name">Guest</span>
				</div>
			</header>

			<ol id="messages" class="messages" aria-live="polite"></ol>

			<form id="composer" class="composer" autocomplete="off">
				<label class="sr-only" for="message-input">Message</label>
				<textarea id="message-input" name="body" rows="1" maxlength="1200" placeholder="Write a message"></textarea>
				<button type="submit">Send</button>
			</form>
		</section>
	</main>
</body>
</html>

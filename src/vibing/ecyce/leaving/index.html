<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="바이빙의 경계를 지나 이끾끼 성소로 이동하는 중입니다.">
  <meta name="theme-color" content="#0b0906">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <title>You're leaving Vibing — CHANNEL 277</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="ambient-word" aria-hidden="true">277</div>

  <header>
    <a href="../" aria-label="이끾끼 전송소로 돌아가기"><span aria-hidden="true">▲</span><strong>이끾끼 전송소</strong></a>
    <p>VOID CHANNEL 277</p>
  </header>

  <main>
    <section class="departure" aria-labelledby="departure-title">
      <div class="gate" aria-hidden="true">
        <span class="gate-ring gate-ring-outer"></span>
        <span class="gate-ring gate-ring-inner"></span>
        <svg class="gate-escape" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <path class="escape-path" d="M 88 88 C 165 -15 325 -145 650 -170"></path>
          <circle class="gate-orbiter" r="8" cx="0" cy="0">
            <animateMotion dur="2.77s" fill="freeze" path="M 88 88 C 165 -15 325 -145 650 -170"></animateMotion>
          </circle>
        </svg>
        <strong>277</strong>
      </div>

      <div class="departure-copy">
        <p class="eyebrow"><span></span> 경계 통과 안내 · 277 / ∞</p>
        <h1 id="departure-title">You're leaving<br><em>Vibing.</em></h1>
        <p class="lede">
          지금부터 바이빙의 주소 바깥으로 이동합니다. 작은 통행 흔적 두 개를 남긴 뒤,
          이끾끼 성소 <strong>/ecyce/</strong>로 연결합니다.
        </p>

        <div class="progress" aria-label="이동 진행 상태">
          <div class="progress-meta">
            <span>자동 이동</span>
            <strong id="countdown" aria-live="polite">2.77초</strong>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
        </div>

        <div class="actions">
          <a class="continue" href="/ecyce/">지금 성소로 이동</a>
          <a class="return" href="../">전송소에 남기</a>
        </div>
        <p class="cookie-note" id="cookie-status">통행 기록 준비 중 · ▲▲▲</p>
      </div>
    </section>
  </main>
</body>
</html>

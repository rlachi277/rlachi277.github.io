<!DOCTYPE html>
<html lang="ko">
<head>
	<title>끾웹</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/assets/favicon.ico">
	<style>
		:root {
			background-color: var(--c-bg);
			color: var(--c-text);
			font-family: "Pretendard GOV Variable", "Pretendard GOV", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
		}

		h1 {
			margin-block: 0;
			font-size: 15em;
			font-weight: 900;
			background-clip: text;
			color: transparent;
			background-image: url('/assets/void/archiveloop.webp');
			background-size: 1000px 1000px;
			animation: infinite linear 5s forwards bgscroll;
		}
		
		a { color: var(--c-link); text-decoration: none; }
		a:hover, a:focus-visible { color: var(--c-linkh); text-decoration: underline; }
		a:active { color: var(--c-linka); text-decoration: underline; }

		@keyframes bgscroll {
            from {
                background-position: 0px 0px;
            }
            to {
                background-position: -1000px -1000px;
            }
        }
	</style>
</head>
<body>
	<h1>403</h1>
	<p>이 페이지를 볼 권한이 없습니다.<br>
	인증을 완료하였다면 새로고침하세요.</p>
	<span><a href="../">상위 폴더로 돌아가기</a> · <a href="/">루트로 돌아가기</a></span>
</body>
</html>

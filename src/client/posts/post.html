<!DOCTYPE html>
<html lang="ko">
<head>
	<title>끾웹 글쓰기</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div id="menubar"> <!-- TODO: implement keyboard navigation and add role="menubar" -->
		<menu>
			<li><button id="menu-file" popovertarget="menu-filesub">파일</button>
			<ul id="menu-filesub" popover>
				<li><button class="menu-action" data-menu="export">JSON으로 저장</button></li>
				<li class="menu-edit"><button class="menu-action" data-menu="load">JSON에서 불러오기...</button></li>
				<li class="menu-edit"><button class="menu-action" data-menu="new">새 글...</button></li>
				<li class="menu-edit"><button class="menu-action" data-menu="duplicate">이 글 복제...</button></li>
				<li class="menu-edit"><button class="menu-action" data-menu="delete">이 글 삭제...</button></li>
			</ul>
			</li>
			<li><button id="menu-edit" popovertarget="menu-editsub">편집</button>
			<ul id="menu-editsub" popover>
				<li><button class="menu-action" data-menu="startEdit">편집 시작</button></li>
				<li class="menu-edit"><button class="menu-action" data-menu="stopEdit">편집 종료</button></li>
			</ul>
			</li>
			<li class="menu-edit"><button id="menu-insert" popovertarget="menu-insertsub">삽입</button>
			<ul id="menu-insertsub" popover>
				<li><button class="menu-action" data-menu="insertP">문단 삽입</button></li>
				<li><button class="menu-action" data-menu="insertSection">&lt;section&gt; 삽입</button></li>
				<li><button class="menu-action" data-menu="insertArticle">&lt;article&gt; 삽입</button></li>
				<li><button class="menu-action" data-menu="insertFieldset">&lt;fieldset&gt; 삽입</button></li>
				<li><button class="menu-action" data-menu="insertLegend">&lt;legend&gt; 삽입</button></li>
				<li><button class="menu-action" data-menu="insertColumns">다단 레이아웃 삽입</button></li>
				<li><button class="menu-action" data-menu="insertHeader">제목 삽입</button></li>
				<li><button class="menu-action" data-menu="insertHgroup">부제 추가/삭제</button></li>
				<li><button class="menu-action" data-menu="deleteElement">요소 삭제</button></li>
				<li><button class="menu-action" data-menu="stopTargeting">삽입/삭제 중단</button></li>
			</ul>
			</li>
		</menu>
	</div>
	<dialog id="dialog">
		<h6 id="dialog-title"></h6>
		<div id="dialog-main"></div>
		<div id="dialog-buttons">
			<button id="dialog-cancel" command="close" commandfor="dialog">취소</button>
			<button id="dialog-confirm">확인</button>
		</div>
	</dialog>
	<div id="warning"></div>
	###여기까지가 템플릿임###
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
	<title id="title">loading</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link id="fav" rel="icon" href="/assets/kimclweb/lstimer/ring_notimer.ico" type="image/ico">
	<style>
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css");

		* {
			transition: var(--default-trans);
		}

		:root {
			--default-trans: background-color 0.5s linear, color 0.5s linear, border-color 0.5s linear, box-shadow 0.5s linear, text-shadow 0.5s linear;
			--trans-center: translate(-50%, -50%);
			--theme-hue:345;
			--theme-solid:hsl(var(--theme-hue),100%,60%);
			--theme-white:hsl(var(--theme-hue),100%,95%);
			--size-ring:min(1.4vw,1vh);
		}

		body {
			background-color: hsl(var(--theme-hue),30%,10%);
			margin:0;
			position: fixed;
			inset:0;
			overflow: hidden;
		}

		.blind {
			position: absolute;
			inset: 0;
			background-color: white;
			transition: opacity 4s;
			z-index: 65535;
		}

		.glowborder {
			position: absolute;
			display: inline-block;
			border: min(0.39vw,0.39vh) solid var(--theme-solid);
		}

		.glowborder.glowmore {
			border: min(0.39vw,0.39vh) solid var(--theme-white);
		}

		.plus {
			transition: var(--default-trans), transform 1s;
			position: absolute;
			left: 50%;
			top: 50%;
			transform: var(--trans-center);
			width: min(2vw,2vh);
		}

		.plus::before {
			content: " ";
			transition: inherit;
			position: inherit;
			left: inherit;
			top: inherit;
			background-color: inherit;
			border-radius: inherit;
			width: inherit;
			height: inherit;
			transform: var(--trans-center) rotate(90deg);
		}

		.plus.pluson {
			transform: var(--trans-center) rotate(45deg);
		}

		.glowring {
			aspect-ratio: 1;
			width: var(--width-normal);
			transition: width 0.5s, height 0.5s, left 0.5s, top 0.5s, opacity 0.5s, border-color 0.5s, box-shadow 0.5s;
			transform: translate(-50%, -50%) rotate(0deg);
			position: absolute;
			left: 50%;
			top: 52.5%;
			box-sizing: border-box;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			border-style: solid;
			border-width: var(--size-ring);
			border-color: transparent;
			background-image: conic-gradient(
				hsl(180,100%,60%) 0deg 22.5deg,
				hsl(320,100%,60%) 22.5deg 67.5deg,
				hsl(300,100%,60%) 67.5deg 112.5deg,
				hsl(280,100%,60%) 112.5deg 157.5deg,
				hsl(260,100%,60%) 157.5deg 202.5deg,
				hsl(240,100%,60%) 202.5deg 247.5deg,
				hsl(220,100%,60%) 247.5deg 292.5deg,
				hsl(200,100%,60%) 292.5deg 337.5deg,
				hsl(180,100%,60%) 337.5deg 360deg);

			background-origin: border-box;
			background-clip: border-box;
		}

		.glowring::before {
			transition: border-width 0.5s;
			position: absolute;
			content: " ";
			box-sizing: content-box;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			border-width: inherit;
			border-style: solid;
			border-color: transparent;
			background-color: hsl(var(--theme-hue),30%,10%);
			background-clip: padding-box;
		}

		.glowring::after {
			transition: border-color 0.5s, border-width 0.5s, box-shadow 0.5s;
			position: absolute;
			content: " ";
			box-sizing: content-box;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			border-width: inherit;
			border-style: solid;
			border-color: transparent;
			box-shadow: 0 0 var(--size-ring) 0 var(--theme-solid),
				inset 0 0 var(--size-ring) 0 var(--theme-solid);
		}

		.glowring.glowmore {
			border-color: hsl(var(--theme-hue),100%,95%);
		}

		#r0 { z-index: -9; --width-normal: calc(68 * var(--size-ring)); --width-retracted: min(13vw,13vh); }
		#r1 { z-index: -8; --width-normal: calc(65 * var(--size-ring)); --width-retracted: min(12.5vw,12.5vh); }
		#r2 { z-index: -7; --width-normal: calc(62 * var(--size-ring)); --width-retracted: min(12vw,12vh); }
		#r3 { z-index: -6; --width-normal: calc(59 * var(--size-ring)); --width-retracted: min(11.5vw,11.5vh); }
		#r4 { z-index: -5; --width-normal: calc(56 * var(--size-ring)); --width-retracted: min(11vw,11vh); }
		#r5 { z-index: -4; --width-normal: calc(53 * var(--size-ring)); --width-retracted: min(10.5vw,10.5vh); }
		#r6 { z-index: -3; --width-normal: calc(50 * var(--size-ring)); --width-retracted: min(10vw,10vh); }
		#r7 { z-index: -2; --width-normal: calc(47 * var(--size-ring)); --width-retracted: min(9.5vw,9.5vh); }
		#r8 { z-index: -1; --width-normal: calc(44 * var(--size-ring)); --width-retracted: min(9vw,9vh); }

		.glowring.retracted {
			position: absolute;
			left: min(11.89vw,11.89vh);
			top: calc(100% - 11.89 * min(1vw,1vh));
			border-width: min(0.3vw,0.3vh);
			transition: opacity 0.5s;
			width: var(--width-retracted);
		}

		.secleft {
			margin: 0;
			position: absolute;
			left: 50%;
			top: 52.5%;
			transform: var(--trans-center); 
			color: var(--theme-solid);
			font-size: calc(5 * var(--size-ring));
			font-family: 'Pretendard GOV Variable', sans-serif;
			font-weight: 800;
			font-variant-numeric: tabular-nums;
			text-shadow: 0 0 var(--size-ring) var(--theme-solid);
		}

		.nigroup {
			position: absolute;
			left: 50%;
			top: 5%;
			transform: translate(-50%,0);
			width: min(40vw,40vh);
			height: min(6vw,6vh);
			border-radius: min(3vw,3vh);
		}

		#nameinput {
			border: min(0.39vw,0.39vh) solid transparent;
			padding: 0;
			display: inline-block;
			text-align: center;
			font-size: min(4vw,4vh);
			font-family: 'Pretendard GOV Variable', sans-serif;
			font-weight: 700;
			color: var(--theme-solid);
			background-color: transparent;
		}

		.ligroup {
			transition: var(--default-trans), 1s opacity, 1s transform;
			position: absolute;
			left: 50%;
			top: 5%;
			opacity: 0%;
			transform: translate(-50%,0);
			width: min(40vw,40vh);
			height: min(3vw,3vh);
			border-radius: min(3vw,3vh);
		}

		#linkinput {
			border: min(0.39vw,0.39vh) solid transparent;
			padding: 0;
			text-align: center;
			font-size: min(2vw,2vh);
			font-family: 'Pretendard GOV Variable', sans-serif;
			color: var(--theme-solid);
			background-color: rgb(from var(--theme-white) r g b / 30%);
		}

		.liopen {
			opacity: 100%;
			transform: translate(-50%,230%);
			display: inline-block;
		}

		#inputs input::placeholder {
			transition: var(--default-trans), opacity 1s;
			color: hsla(var(--theme-hue),100%,60%,60%);
			opacity: 0%;
		}

		#inputs input.glowplaceholder {
			color: var(--theme-white);
		}

		#inputs input.glowplaceholder::placeholder {
			color: hsla(var(--theme-hue),100%,90%,60%);
			opacity: 100%;
		}

		.nedisplay {
			box-sizing: content-box;
			border-radius: 50%;
			width: min(3vw,3vh);
			height: min(3vw,3vh);
			/*background-color: transparent;*/
			position: absolute;
			left: calc(50% + 24 * min(1vw,1vh));
			top: calc(5% + 1.5 * min(1vw,1vh));
			transform: translate(-50%,0%);
			padding: 0;
		}

		#nameedit {
			box-sizing: content-box;
			border-radius: 50%;
			border: min(0.39vw,0.39vh) solid transparent;
			width: min(3vw,3vh);
			height: min(3vw,3vh);
			background-color: transparent;
			position: absolute;
			left: calc(50% + 24 * min(1vw,1vh));
			top: calc(5% + 1.5 * min(1vw,1vh));
			transform: translate(-50%,0%);
			padding: 0;
		}

		.glowline {
			height: min(0.39vw,0.39vh);
			border-radius: min(0.195vw,0.195vh);
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: var(--theme-solid);
		}

		.glowline.glowmore {
			background-color: var(--theme-white);
		}

		.datecontainer {
			width: min(48vw,48vh);
			height: min(4.5vw,4.5vh);
			border-radius: min(4.5vw,4.5vh);
			position: absolute;
			right: 3vw;
			bottom: 3vh;
		}

		.datecontainer.shrunk {
			width: min(38.55vw,38.55vh);
		}

		.dedisplay, .dzdisplay {
			width: min(3vw,3vh);
			height: min(3vw,3vh);
			border-radius: 50%;
			position: absolute;
			top: 50%;
			transform: translate(0,-50%);
		}

		#dateedit, #datezero {
			width: min(3vw,3vh);
			height: min(3vw,3vh);
			border: min(0.39vw,0.39vh) solid transparent;
			border-radius: 50%;
			box-sizing: content-box;
			padding: 0;
			position: absolute;
			top: 50%;
			transform: translate(0,-50%);
			background: transparent;
		}

		.dedisplay, #dateedit { left:min(0.38vw,0.38vh); }
		.dzdisplay, #datezero { left: min(4.5vw,4.5vh); }

		.zero {
			width: min(0.8vw,0.8vh);
			height: min(1.6vw,1.6vh);
			border-radius: min(1vw,1vh);
			position: absolute;
			left: 50%;
			top: 50%;
			transform: var(--trans-center);
		}

		.datetextcon {
			display: inline-block;
			position: absolute;
			right: min(0.25vw,0.25vh);
			width: min(39.75vw,39.75vh);
			height: 100%;
		}

		.datetext {
			height: min(3vw,3vh);
			line-height: min(3vw,3vh);
			border-radius: min(3vw,3vh);
			position: absolute;
			top: 50%;
			transform: translate(0, -50%);
			color: var(--theme-solid);
			font-family: 'Pretendard GOV Variable', sans-serif;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
			font-size: min(2.5vw,2.5vh);
			text-align: center;
			vertical-align: middle;
		}

		#dyear { left: 4.7%; width: 24%; }
		#dmonth { left: 31.7%; width: 12%; }
		#dday { left: 46.7%; width: 12%; }
		#dhour { left: 70.7%; width: 12%; }
		#dmin { left: 85.7%; width: 12%; }

		.datesep {
			position: absolute;
			left: 65.7%;
			top: 50%;
			width: min(3vw,3vh);
			transform: var(--trans-center) rotate(90deg);
		}

		.datetextactive:hover {
			border: min(0.39vw,0.39vh) solid var(--theme-white);
			color: var(--theme-white);
		}

		#dateinput {
			transition: opacity 1s;
			position: absolute;
			height: 100%;
			right: min(-0.39vw,-0.39vh);
			bottom: 115%;
			background-color: #FFFFFF88;
			border: min(0.39vw,0.39vh) solid white;
			border-radius: min(3vw,3vh);
			padding: 0 min(0.65vw,0.65vh);
			font-family: monospace;
			font-size: min(2.5vw,2.5vh);
			line-height: min(4.5vw, 4.5vh);
		}

		.pdisplay, #play {
			transition: var(--default-trans), transform 0.5s;
			width: min(15vw,15vh);
			height: min(15vw,15vh);
			border-radius: 50%;
		}

		.pdisplay {
			position: absolute;
			left: min(4vw,4vh);
			bottom: min(4vw,4vh);
		}
		.pdisplay.datetextactive:has(#play:hover) { border: min(0.39vw,0.39vh) solid var(--theme-white); }

		#play {
			border-radius: min(15vw,15vh);
			z-index: 48;
			padding: 0;
			box-sizing: content-box;
			border: min(0.39vw,0.39vh) solid transparent;
			background: transparent;
			position: relative;
			right: min(0.39vw,0.39vh);
			bottom: min(0.39vw,0.39vh);
		}

		.playline {
			transition: var(--default-trans), opacity 1s;
			width: min(6vw,6vh);
		}

		.ringnum {
			transition: var(--default-trans), opacity 1s;
			position: absolute;
			left: 50%;
			top: 50%;
			transform: var(--trans-center); 
			margin: 0;
			font-family: 'Pretendard GOV Variable', sans-serif;
			font-weight: 500;
			font-variant-numeric: tabular-nums;
			font-size: min(3.75vw,3.75vh);
			text-align: center;
			color: var(--theme-solid);
			text-shadow: 0 0 min(0.5vw,0.5vh) var(--theme-solid);
		}

		.pdisplay.datetextactive:has(#play:hover) .ringnum {
			color: var(--theme-white);
			text-shadow: 0 0 min(0.5vw,0.5vh) var(--theme-white);
		}

		@keyframes rotate0 { to { transform: translate(-50%, -50%) rotate(0deg); } }
		@keyframes rotate45 { to { transform: translate(-50%, -50%) rotate(45deg); } }
		@keyframes rotate90 { to { transform: translate(-50%, -50%) rotate(90deg); } }
		@keyframes rotate135 { to { transform: translate(-50%, -50%) rotate(135deg); } }
		@keyframes rotate180 { to { transform: translate(-50%, -50%) rotate(180deg); } }
		@keyframes rotate225 { to { transform: translate(-50%, -50%) rotate(225deg); } }
		@keyframes rotate270 { to { transform: translate(-50%, -50%) rotate(270deg); } }
		@keyframes rotate315 { to { transform: translate(-50%, -50%) rotate(315deg); } }

		.rotate0 { transform: translate(-50%, -50%) rotate(360deg); }
		.rotate45 { transform: translate(-50%, -50%) rotate(45deg); }
		.rotate90 { transform: translate(-50%, -50%) rotate(90deg); }
		.rotate135 { transform: translate(-50%, -50%) rotate(135deg); }
		.rotate180 { transform: translate(-50%, -50%) rotate(180deg); }
		.rotate225 { transform: translate(-50%, -50%) rotate(225deg); }
		.rotate270 { transform: translate(-50%, -50%) rotate(270deg); }
		.rotate315 { transform: translate(-50%, -50%) rotate(315deg); }

		@keyframes retract {
			from {
				left: 50%;
				top: 52.5%;
				width: var(--width-normal);
				border-width: var(--size-ring);
			}
			to {
				left: min(11.89vw,11.89vh);
				top: calc(100% - 11.89 * min(1vw,1vh));
				width: var(--width-retracted);
				border-width: min(0.3vw, 0.3vh);
			}
		}

		@keyframes expand {
			from {
				left: min(11.89vw,11.89vh);
				top: calc(100% - 11.89 * min(1vw,1vh));
				width: var(--width-retracted);
				border-width: min(0.3vw, 0.3vh);
			}
			to {
				left: 50%;
				top: 52.5%;
				width: var(--width-normal);
				border-width: var(--size-ring);
			}
		}

		@keyframes finalspin-odd {
			to { transform: translate(-50%, -50%) rotate(-1800deg); }
		}

		@keyframes finalspin-even {
			to { transform: translate(-50%, -50%) rotate(1800deg); }
		}

		.hidden { display: none; }
		.transparent { opacity: 0; }
	</style>
	<script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"></script>
	<script src="/assets/kimclweb/ecyce/global/kimclmenu.js" type="module"></script>
</head>
<body>
	<kimcl-menu></kimcl-menu>
	<div class="blind hidden transparent"></div>
	<div class="glowring retracted rotate0" id="r0" angle="-1" style="opacity:0%;"></div>
	<div class="glowring retracted rotate0" id="r1" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r2" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r3" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r4" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r5" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r6" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r7" angle="-1" ></div>
	<div class="glowring retracted rotate0" id="r8" angle="-1" ></div>
	<p class="secleft">
		<span class="d1">0</span>
		<span class="d2">0</span>
		<span class="d3">0</span>
		<span class="d4">0</span>
		<span class="d5">0</span>
		<span class="d6">0</span>
		<span class="d7">0</span>
		<span class="d8">0</span>
	</p>
	<div id="inputs">
		<div class="nigroup glowborder" id="nidisplay"></div>
		<div class="ligroup glowborder hidden" id="lidisplay"></div>
		<input class="nigroup" id="nameinput" placeholder="이름 입력" readonly>
		<input class="ligroup hidden" id="linkinput" placeholder="링크 없음" readonly>
	</div>
	<div class="nedisplay glowborder"></div>
	<button id="nameedit" class="">
		<div class="nameplus plus glowline"></div>
	</button>
	<div class="datecontainer glowborder">
		<div class="dedisplay glowborder"></div>
		<button id="dateedit">
			<div class="dateplus plus glowline"></div>
		</button>
		<div class="dzdisplay glowborder"></div>
		<button id="datezero" class="">
			<div class="zero glowborder"></div>
		</button>
		<div class="datetextcon">
			<div class="datetext glowborder" id="dyear"></div>
			<div class="datetext glowborder" id="dmonth"></div>
			<div class="datetext glowborder" id="dday"></div>
			<div class="datesep glowline" id="dateseparate"></div>
			<div class="datetext glowborder" id="dhour"></div>
			<div class="datetext glowborder" id="dmin"></div>
		</div>
		<input id="dateinput" class="transparent" type="datetime-local">
	</div>
	<div class="pdisplay glowborder">
		<p class="ringnum">8</p>
		<button id="play">
			<div class="playline plus pluson glowline transparent"></div>
		</button>
	</div>
	<script>
		var store = {"target":undefined,"zero":undefined,"running":false,"name":"","link":"","ring":1};
		function save() {
			let now = new Date();
			if (store.target==undefined || store.target<now) {
				store.target = now;
				store.zero=true;
				reload_date();
				set_vnum(0);
				set_rnum(0);
			} else {
				store.zero = false;
			}
			localStorage.setItem("lstimer.store", JSON.stringify(store));
		}

		function load() {
			let now = new Date();
			if (localStorage.getItem("lstimer.store")!=null) store = JSON.parse(localStorage.getItem("lstimer.store"));
			if (store.zero || store.target==undefined || new Date(store.target)<now) {
				store.target=now;
				store.zero=true;
			} else {
				store.target = new Date(store.target);
			}
			reload_date();

			if (store.name!=undefined) $("#nameinput").val(store.name);
			else store.name="";
			if (store.link!=undefined) $("#linkinput").val(store.link);
			else store.link="";
			set_title(store.name);

			if (store.ring==undefined) store.ring=1;
			reload_ringnum();
			reload_hue();

			if (store.running) start_timer();
			localStorage.setItem("lstimer.store", JSON.stringify(store));
		}

		function reload_date() {
			$("#dyear").text(store.target.getFullYear());
			$("#dmonth").text(store.target.getMonth()+1);
			$("#dday").text(store.target.getDate());
			$("#dhour").text(store.target.getHours());
			$("#dmin").text(store.target.getMinutes());
			$("#dateinput").val(new Date(input_date().valueOf()-new Date().getTimezoneOffset() * 60000).toISOString().substring(0,16));
		}

		function reload_ringnum() {
			$(".glowring").removeClass("transparent");
			for (let i=0; i<=8; i++) {
				if (i>=store.ring) break;
				$(`#r${i}`).addClass("transparent");
			}
			$(".ringnum").text(9-store.ring);
		}


		function set_var(name,value) { $(":root").css(name,value); }
		function reset_var(name) { $(":root").css(name,""); }


		var icon = "";
		function set_icon(name) {
			if (name==icon) return;
			icon=name;
			$("#fav").attr("href",`/assets/kimclweb/lstimer/ring${name}.ico`);
		}

		var title="loading";
		function set_title(name) {
			if (name==undefined || name==title) return;
			title=name;
			$("#title").text(name);
		}

		var huetrans = true;
		function set_huetrans(val) {
			if (val==huetrans) return;
			huetrans=val;
			if (huetrans) reset_var("--default-trans");
			else set_var("--default-trans","none");
		}


		var rdigits=[-1,0,0,0,0,0,0,0,0]; // real digits
		var vdigits=[-1,0,0,0,0,0,0,0,0]; // visual digits

		function get_rnum() {
			let result=0;
			for (let i=1; i<=8; i++) {
				result*=10;
				result+=rdigits[i];
			}
			return result;
		}
		
		function set_vnum(num) {
			for (let i=8; i>=2; i--) {
				set_vdigit(i,num%10);
				num=Math.floor(num/10);
			}
			set_vdigit(1,num);
		}

		function set_vdigit(dnum,val) {
			$(`.d${dnum}`).text(val<10?val:String.fromCharCode(55+val));
			vdigits[dnum]=val;
		}

		function set_rnum(num) {
			for (let i=8; i>=2; i--) {
				rdigits[i] = num%10;
				num=Math.floor(num/10);
			}
			rdigits[1] = num;
		}

		var in_animation = false;
		var cur_animation = 0;
		function anim_vnum(num,duration) {
			in_animation = true;
			cur_animation++;
			let isUp = get_rnum()<num;
			set_rnum(num);
			
			let cur, steps, point;
			for (let i=8; i>=1; i--) {
				cur=rdigits[i];
				if (isUp) {
					point=vdigits[i];
					if (i==1) steps=cur-point;
					else steps=(cur-point+10)%10;
					for (let j=0; j<steps; j++) {
						point++;
						if (i!=1) point%=10;
						window.setTimeout(set_vdigit_anim,duration/steps*j,i,point,cur_animation);
					}
				} else {
					point=vdigits[i];
					if (i==1) steps=point-cur;
					else steps=(point-cur+10)%10;
					for (let j=0; j<steps; j++) {
						point--;
						if (point<0) point+=10;
						window.setTimeout(set_vdigit_anim,duration/steps*j,i,point,cur_animation);
					}
				}
			}

			window.setTimeout(function(num,code) {
				if (cur_animation != code) return;
				in_animation = false;
				set_vnum(num);
			},duration+10,num,cur_animation);
		}

		function set_vdigit_anim(dnum,val,code) {
			if (cur_animation != code) return;
			$(`.d${dnum}`).text(val<10?val:String.fromCharCode(55+val));
			vdigits[dnum]=val;
		}


		var is_editing_name = false;
		$("#nameedit").on("click",function() {
			if (store.running||is_editing_date) return;
			if (is_editing_name) {
				window.setTimeout(close_linkinput,10);
				is_editing_name=false;
				store.name=$("#nameinput").val();
				store.link=$("#linkinput").val();
				save();
			} else {
				$(".ligroup").removeClass("hidden");
				window.setTimeout(open_linkinput,10);
				is_editing_name=true;
			}
		});

		var close_killcode;
		function open_linkinput() {
			window.clearInterval(close_killcode);
			$("#nameinput").prop("readonly",false);
			$("#linkinput").prop("readonly",false);
			$("#nameedit .nameplus").addClass("glowmore");
			$(".nedisplay").addClass("glowmore");
			$("#inputs .glowborder").addClass("glowmore");
			$("#inputs input").addClass("glowplaceholder");
			$(".ligroup").addClass("liopen");
			$(".nameplus").addClass("pluson");
		}

		function close_linkinput() {
			window.clearInterval(close_killcode);
			$("#nameinput").prop("readonly",true);
			$("#linkinput").prop("readonly",true);
			$("#nameedit .nameplus").removeClass("glowmore");
			$(".nedisplay").removeClass("glowmore");
			$("#inputs .glowborder").removeClass("glowmore");
			$("#inputs input").removeClass("glowplaceholder");
			$(".ligroup").removeClass("liopen");
			$(".nameplus").removeClass("pluson");
			close_killcode=window.setTimeout(function() {
				$(".ligroup").addClass("hidden");
			},1010);
		}


		var is_editing_date=false;
		$("#dateedit").on("click",function() {
			if (store.running||is_editing_name) return;
			if (is_editing_date) {
				window.setTimeout(close_dateedit,10);
				store.target = input_date();
				anim_vnum(0,500);
				set_rnum(0);
				is_editing_date=false;
				save();
			} else {
				if (!store.zero) anim_vnum(until(input_date()),500);
				window.setTimeout(open_dateedit,10);
				is_editing_date=true;
			}
		});

		function open_dateedit() {
			$(".datecontainer").addClass("glowmore");
			$("#dateedit .dateplus").addClass("glowmore");
			$(".dedisplay").addClass("glowmore");
			$(".dedisplay").addClass("glowmore");
			$("#dateseparate").addClass("glowmore");
			$(".datetext").addClass("datetextactive");
			$(".pdisplay").addClass("datetextactive");
			$(".dateplus").addClass("pluson");
			reload_hue();
		}

		function close_dateedit() {
			$(".datecontainer").removeClass("glowmore");
			$("#dateedit .dateplus").removeClass("glowmore");
			$(".dedisplay").removeClass("glowmore");
			$("#dateseparate").removeClass("glowmore");
			$(".datetext").removeClass("datetextactive");
			$(".pdisplay").removeClass("datetextactive");
			$(".dateplus").removeClass("pluson");
			if (input_date()>new Date()) store.zero = false;
			if (is_dateinput_on) {
				is_dateinput_on = false;
				$("#dateinput").addClass("transparent");
			}
			reload_hue();
		}

		$("#datezero").on("click",function() {
			if (!is_editing_date) return;
			store.zero=true;
			store.target=new Date();
			anim_vnum(0,500);
			$(".dzdisplay").addClass("glowmore");
			$(".zero").addClass("glowmore");
			reload_date();

			window.setTimeout(function() {
				$(".dzdisplay").removeClass("glowmore");
				$(".zero").removeClass("glowmore");
			},500);
		});


		document.addEventListener("keydown",function(event) {
			if (is_editing_date && (event.key=='ArrowUp' || event.key=='ArrowDown')) {
				modify_date(event.key=='ArrowUp');
			}
		});

		function modify_date(isUp) {
			let now = new Date();
			if ($("#dyear").is(':hover')) {
				if (isUp) {
					if (until(input_date(1,0,0,0,0))>=ringcap()) return;
					$("#dyear").text(Number.parseInt($("#dyear").text())+1);
				} else {
					if (until(input_date(-1,0,0,0,0))<0) return;
					$("#dyear").text(Number.parseInt($("#dyear").text())-1);
				}
			} else if ($("#dmonth").is(':hover')) {
				if (isUp) {
					if (until(input_date(0,1,0,0,0))>=ringcap()) return;
					$("#dmonth").text(Number.parseInt($("#dmonth").text())+1);
				} else {
					if (until(input_date(0,-1,0,0,0))<0) return;
					$("#dmonth").text(Number.parseInt($("#dmonth").text())-1);
				}
				if ($("#dday").text()>month_length(now.getFullYear(),$("#dmonth").text())) $("#dday").text(month_length(now.getFullYear(),$("#dmonth").text()));
			} else if ($("#dday").is(':hover')) {
				if (isUp) {
					if (until(input_date(0,0,1,0,0))>=ringcap()) return;
					$("#dday").text(Number.parseInt($("#dday").text())+1);
				} else {
					if (until(input_date(0,0,-1,0,0))<0) return;
					$("#dday").text(Number.parseInt($("#dday").text())-1);
				}
			} else if ($("#dhour").is(':hover')) {
				if (isUp) {
					if (until(input_date(0,0,0,1,0))>=ringcap()) return;
					$("#dhour").text(Number.parseInt($("#dhour").text())+1);
				} else {
					if (until(input_date(0,0,0,-1,0))<0) return;
					$("#dhour").text(Number.parseInt($("#dhour").text())-1);
				}
			} else if ($("#dmin").is(':hover')) {
				if (isUp) {
					if (until(input_date(0,0,0,0,1))>=ringcap()) return;
					$("#dmin").text(Number.parseInt($("#dmin").text())+1);
				} else {
					if (until(input_date(0,0,0,0,-1))<0) return;
					$("#dmin").text(Number.parseInt($("#dmin").text())-1);
				}
			} else if ($("#play").is(':hover')) {
				modify_ringnum(isUp);
			}
			store.target=input_date();
			store.zero = (store.target<=now);
			if (!store.zero) anim_vnum(until(input_date()),500);
			reload_date();
			reload_hue();
		}

		function input_date(ytweak,mtweak,dtweak,htweak,mintweak) {
			if (ytweak==undefined) {
				ytweak = mtweak = dtweak = htweak = mintweak = 0;
			}
			let date=Number.parseInt($("#dday").text());
			if (date<=month_length($("#dyear").text(),$("#dmonth").text())&&date>month_length($("#dyear").text()+ytweak,$("#dmonth").text()+mtweak)) date=month_length($("#dyear").text()+ytweak,$("#dmonth").text()+mtweak);
			return new Date(Number.parseInt($("#dyear").text())+ytweak,Number.parseInt($("#dmonth").text())-1+mtweak,date+dtweak,Number.parseInt($("#dhour").text())+htweak,Number.parseInt($("#dmin").text())+mintweak,0);
		}

		function month_length(year,month) {
			month=Number.parseInt(month);
			switch (month) {
				case 1: case 3: case 5: case 7:
				case 8: case 10: case 12:
					return 31;
				case 4: case 6: case 9: case 11:
					return 30;
				case 2:
					return 28+(year%4==0&&(year%100!=0||year%400==0));
			}
		}


		var is_dateinput_on = false;
		$("#dyear").on("click",function() {
			if (!is_dateinput_on) {
				if (!is_editing_date) return;
				is_dateinput_on=true;
				$("#dateinput").removeClass("transparent");
			} else {
				is_dateinput_on=false;
				$("#dateinput").addClass("transparent");
				reload_date();
				save();
			}
		});

		$("#dateinput").on("input",function() {
			let cursec = until(new Date($("#dateinput").val()));
			if (cursec<ringcap()) {
				if (cursec<=0) {
					store.zero = true;
					store.target = new Date();
					set_vnum(0);
					set_rnum(0);
				} else {
					store.zero = false;
					store.target = new Date($("#dateinput").val());
				}
			}
			reload_date();
			reload_hue();
			save();
		});


		function ringcap() {
			return 1<<(3*(9-store.ring));
		}

		function modify_ringnum(isUp) {
			if (isUp) {
				if (store.ring==0) return;
				store.ring--;
			} else {
				if (store.ring==7) return;
				if (until(input_date())>ringcap()/8) return;
				store.ring++;
			}
			reload_ringnum();
		}


		$("#play").on("click",function() {
			if (store.running) {
				suspend_timer();
				save();
				return;
			}
			if (is_editing_name || !is_editing_date || store.zero) return;
			store.target = input_date();
			store.running = true;
			save();
			start_timer();
		});

		var is_actually_running=false;
		function start_timer() {
			is_editing_date = false;
			close_dateedit();

			$(".pdisplay").removeClass("datetextactive").addClass("glowmore");
			$(".playline").removeClass("transparent").addClass("glowmore");
			$(".nedisplay, #nameedit, .dedisplay, #dateedit, .dzdisplay, #datezero, #nidisplay").addClass("hidden");
			$(".ringnum").addClass("transparent");
			$(".datecontainer").addClass("shrunk");
			$(".glowring").css("animation", "0.5s forwards expand").removeClass("retracted");
			
			window.setTimeout(function() {
				time=Math.floor(until(input_date(),true)-1.5);
				for (let i=store.ring; i<=8; i++) {
					let curRot=get_angle(time,i);
					rotation[i]=curRot;
					$(`#r${i}`).attr("angle",`${curRot}`);
					$(`#r${i}`).css("animation", `1s cubic-bezier(.3,0,.5,1.75) forwards rotate${curRot}`);
				}
			},510);
			window.setTimeout(function() {
				if (!store.running) return;
				set_huetrans(false);
				is_actually_running=true;
			},1500);
		}

		function suspend_timer() {
			store.running = false;
			is_actually_running = false;

			$(".pdisplay").removeClass("glowmore");
			$(".playline").removeClass("glowmore");
			$(".playline").addClass("transparent");
			$(".nedisplay, #nameedit, .dedisplay, #dateedit, .dzdisplay, #datezero, #nidisplay").removeClass("hidden");
			$(".ringnum").removeClass("transparent");
			$(".datecontainer").removeClass("shrunk");
			$(".glowring").removeClass("rotate0").removeClass("rotate45").removeClass("rotate90").removeClass("rotate135").removeClass("rotate180").removeClass("rotate225").removeClass("rotate270").removeClass("rotate315").each(function() {
				$(this).addClass(`rotate${$(this).attr("angle")}`);
			});
			$(".glowring").css("animation", "0.5s forwards retract").addClass("retracted");
			
			set_huetrans(true);
			if (!store.zero) anim_vnum(until(input_date()),500);
			window.setTimeout(open_dateedit,10);
			is_editing_date=true;
			window.setTimeout(function() {
				if (store.running) return;
			}, 500);
		}

		function redirect() {
			window.clearInterval(KILLCODE);
			is_actually_running = false;
			store.running = false;
			store.link = "";
			save();

			set_huetrans(true);
			$(".glowring").addClass("glowmore");
			set_var("--theme-hue","140");
			set_icon("_redirect");
			$(".blind").removeClass("hidden");

			window.setTimeout(function() {
				$(".blind").removeClass("transparent");
			},1500);

			window.setTimeout(function() {
				window.location.href = $("#linkinput").val();
			},6000);
		}

		function until(date,millisecond) {
			let now = new Date();
			if (!millisecond) return Math.floor((date - now) / 1000);
			return (date - now) / 1000;
		}

		function get_angle(second,ringnum) {
			let sleft=second;
			sleft>>=3*(8-ringnum);
			sleft=(sleft)%8*45;
			return sleft;
		}

		function percent() {
			if (store.ring==0) {
				return `${(100-get_rnum()/ringcap()*100).toFixed(6)}%`;
			} else if (store.ring<4) {
				return `${(100-get_rnum()/ringcap()*100).toFixed(7-store.ring)}%`;
			} else {
				return `${(100-get_rnum()/ringcap()*100).toFixed(3)}%`;
			}
		}

		const tick_length = 49;
		const reload_time_ticks = 1;
		const reload_hue_ticks = 20;
		var since_reload_time = reload_time_ticks-1;
		var since_reload_hue = reload_hue_ticks-1;
		function tick() {
			since_reload_time++;
			since_reload_hue++;
			if (since_reload_time>=reload_time_ticks) {
				since_reload_time=0;
				reload_time();
			}
			if (since_reload_hue>=reload_hue_ticks) {
				since_reload_hue=0;
				reload_hue();
			}
		}

		var hue=-1;
		function reload_hue() {
			if (is_editing_date&&store.zero) {
				if (hue==170) return;
				set_var("--theme-hue","170");
				hue=170;
				set_icon("0");
				return;
			}
			if (is_editing_date||store.running) {
				var n_hue=get_rnum()/ringcap();
				set_icon(Math.round(n_hue*8).toString());
				n_hue=Math.floor(n_hue*160+170);
				if (hue==n_hue) return;
				hue=n_hue;
				set_var("--theme-hue",hue);
				return;
			}
			if (hue==345) return;
			reset_var("--theme-hue");
			hue=345;
			set_icon("_notimer");
		}

		var time=-1;
		var rotation=[-1,-1,-1,-1,-1,-1,-1,-1,-1];
		function reload_time() {
			let now = new Date();
			if (store.zero) {
				store.target=now;
				reload_date();
			}
			if (is_editing_date) {
				store.zero = (input_date()<=now);
			}  else if (is_actually_running) {
				if (input_date()<=now) {
					store.running=false;
					store.zero=true;
					save();
					if (store.link!="") {
						redirect();
					} else {
						suspend_timer();
					}
					return;
				}
				if (until(input_date(),true)-0.5 < time) {
					time=Math.floor(until(input_date(),true)-0.5);
					if (store.link!="" && time<0) {
						$("#r1, #r3, #r5, #r7").css("animation","1s cubic-bezier(1,0,.8,.25) forwards finalspin-odd");
						$("#r0, #r2, #r4, #r6, #r8").css("animation","1s cubic-bezier(1,0,.8,.25) forwards finalspin-even");
					} else {
						for (var i=store.ring; i<=8; i++) {
							var curRot=get_angle(time,i);
							if (rotation[i]==curRot) continue;
							rotation[i]=curRot;
							$(`#r${i}`).css("animation",`0.5s cubic-bezier(1,0,.8,.25) forwards rotate${curRot}`);
							$(`#r${i}`).attr("angle",`${curRot}`);
						}
					}
				}
			}
			if (!in_animation&&(store.running||(is_editing_date&&!store.zero))) {
				set_vnum(until(input_date()));
				set_rnum(until(input_date()));
			}
			if (!store.running) {
				set_title(store.name);
			}
		}

		$(".glowring").on("animationend", function(event) {
			if (event.animationName=="retract" || event.animationName=="expand") return;
			$(this).removeClass("rotate0").removeClass("rotate45").removeClass("rotate90").removeClass("rotate135").removeClass("rotate180").removeClass("rotate225").removeClass("rotate270").removeClass("rotate315");
			$(this).addClass(`rotate${$(this).attr("angle")}`);
			if ($(this).is("#r8")) set_title(`${store.name}: ${percent()}`);
		})


		var KILLCODE=0;
		window.onload = function() {
			console.log("loading...");
			KILLCODE = window.setInterval(tick,tick_length);
			window.setTimeout(load,10);
		}

		window.onbeforeunload = function() {
			window.clearInterval(KILLCODE);
			save();
			console.log("quitting...");
		}
	</script>
</body>
</html>

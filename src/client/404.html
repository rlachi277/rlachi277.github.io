<!DOCTYPE html>
<html lang="ko">
<head>
	<title>끾웹</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/assets/favicon.ico">
	<style>
		:root {
			--c-bg: light-dark(#f8f9fa, #202122);
			--c-text: light-dark(#202122, #eaecf0);
			--c-link: light-dark(#36c,#88a3e8);
			--c-linkh: light-dark(#3056a9,#a6bbf5);
			--c-linka: light-dark(#233566,#b6d4fb);

			background-color: var(--c-bg);
			color: var(--c-text);
			font-family: "Pretendard GOV Variable", "Pretendard GOV", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
		}

		h1 {
			margin-block: 0;
			font-size: 15em;
			font-weight: 900;
			background-clip: text;
			color: transparent;
			background-image: url('/assets/kimclweb/ecyce/things/archive/qpiarea/arealoop.webp');
			background-size: 1000px 1000px;
			animation: infinite linear 5s forwards bgscroll;
		}
		
		a { color: var(--c-link); text-decoration: none; }
		a:hover, a:focus-visible { color: var(--c-linkh); text-decoration: underline; }
		a:active { color: var(--c-linka); text-decoration: underline; }

		@keyframes bgscroll {
            from {
                background-position: 0px 0px;
            }
            to {
                background-position: -1000px -1000px;
            }
        }
	</style>
</head>
<body>
	<h1>404</h1>
	<a href="/">루트로 돌아가기</a>
</body>
</html>

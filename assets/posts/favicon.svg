<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24">
    <style>
		.light { display: block; }
		.dark { display: none; }
		@media (prefers-color-scheme: dark) {
			.light { display: none; }
			.dark { display: block; }
		}
	</style>
	<image class="light" href="data:image/png;base64," width="24" height="24"/>
	<image class="dark" href="data:image/png;base64," width="24" height="24"/>
</svg>
<!DOCTYPE html>
<html lang="ko">
<head>
	<title>이끾끼를 숭배하라</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/client/colors.css">
	<style>
		:root {
			background-color: var(--c-bg);
			color: var(--c-text);
			font-family: sans-serif;
		}

		body {
			padding-inline: max(2%, 1rem);
			margin: 0;
			margin-block-start: calc(-1lh + -4px);
			margin-block-end: 3rem;
		}

		@media screen and (max-width: 480px) {
			body { margin-block-start: -2rem; }
		}

		h1 { font-size: 3em; }
		h2 { font-size: 2em; }
		h3 { font-size: 1.5em; }
		h4 { font-size: 1.33em; }
		h5 { font-size: 1.17em; }
		h6 { font-size: 1em; }
		h1, h2, h3, h4, h5, h6 { margin-block-start: 1em; margin-block-end: 0.25em; }

		p {
			text-align: justify;
			margin-block: 0.4lh;
		}

		hr { color: inherit; border: none; margin-block: calc(0.5lh - 0.5px); border-block-start: 1px solid currentColor; }

		sub {
			vertical-align: baseline;
			font-size: 0.7em;
			font-weight: 550;
		}

		ol, ul { margin-block: 0.4lh; }
		ul { padding-inline-start: 2ch; }
		ol { padding-inline-start: 2ch; }
		:is(dir, menu, ol, ul) ol {
			list-style-type: lower-alpha;
		}
		:is(dir, menu, ol, ul) :is(dir, menu, ol, ul) ol {
			list-style-type: lower-roman;
		}

		li { margin-block: 0.4lh; }
		li:has( > details) { list-style: none; }
		li > details > summary { list-style-position: outside; }

		a { color: var(--c-link); text-decoration: none; }
		a:hover, a:focus-visible { color: var(--c-linkh); text-decoration: underline; }
		a:active { color: var(--c-linka); text-decoration: underline; }
		a.broken { color: var(--c-linke); }
		a.broken:hover, a.broken:focus-visible { color: var(--c-linkeh); }
		a.broken:active { color: var(--c-linkea); }
		a.self { color: var(--c-links); }
		a.self:hover, a.self:focus-visible { color: var(--c-linksh); }
		a.self:active { color: var(--c-linksa); }
	</style>
</head>
<body>
	<h1>Cycweb</h1>
	<p>끾웹</p>
	<section>
		<h2>글쓰기 시스템</h2>
		<ul>
			<li><a href="posts/">posts/</a> · 글쓰기 시스템용 수제 편집기</li>
			<Li><a href="cycelog/">cycelog/</a> · 글쓰기 시스템 기반 1차·3차 기록</Li>
		</ul>
	</section>
	<section>
		<h2>기타</h2>
		<ul>
			<li><a href="vibing/">vibing/</a> · 이 안에서 무슨 일이 일어나는지 저는 모릅니다<sub>농담 아니에요 보안 조심하세요</sub></li>
		</ul>
	</section>
</body>
</html>

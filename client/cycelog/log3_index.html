<!DOCTYPE html>
<html lang="ko">
<head>
	<title>cycelog log 3</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/client/colors.css">
	<link rel="stylesheet" href="/client/posts/style.css">
	<script type="module">
		import { setup } from "/client/posts/script.js";
		import { defaultMenu, editMenu } from "/client/cycelog/log3_menu.js";
		setup({...defaultMenu, ...editMenu}, null, true);
	</script>
</head>
<body>
	<div id="menubar"> <!-- TODO: implement keyboard navigation and add role="menubar" -->
		<menu>
			<li><button id="menu-file" popovertarget="menu-filesub">파일</button>
			<ul id="menu-filesub" popover>
				<li><button class="menu-action" data-menu="new">새 글...</button></li>
			</ul>
			</li>
			<li><button id="menu-record" popovertarget="menu-recordsub">기록</button>
			<ul id="menu-recordsub" popover>
				<li><button class="menu-action" data-menu="toLog1">1차 기록 보기</button></li>
			</ul>
			</li>
		</menu>
	</div>
	<dialog id="dialog">
		<h6 id="dialog-title"></h6>
		<div id="dialog-main"></div>
		<div id="dialog-buttons">
			<button id="dialog-cancel" command="close" commandfor="dialog">취소</button>
			<button id="dialog-confirm">확인</button>
		</div>
	</dialog>
	<div id="warning" role="alert"></div>
	<h1>끾기록: 3차 기록</h1>
	###여기까지가 템플릿임###
	<p><strong>경고:</strong> 한 글의 내용을 'JSON으로 저장'을 통해 저장한 뒤, 이를 'JSON에서 불러오기'를 통해 다른 글로 불러와서는 안 됩니다. 이는 원래의 글에 있던 언급이 새 글에서도 남아 있게 하며, 예상치 못한 동작을 초래할 수 있습니다. 이를 막기 위한 시스템적 조치는 취하지 않았습니다.</p>
</body>
</html>

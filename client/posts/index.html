<!DOCTYPE html>
<html lang="ko">
<head>
	<title>cycweb post</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/client/posts/colors.css">
	<link rel="stylesheet" href="/client/posts/style.css">
	<script src="/client/posts/script.js" type="module"></script>
</head>
<body>
	<header>
		<menu>
			<li><button id="menu-file" popovertarget="menu-filesub">파일</button>
			<ul id="menu-filesub" popover>
				<li><button class="menu-action" id="menu-export">JSON으로 저장</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-load">JSON에서 불러오기...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-new">새 글...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-duplicate">이 글 복제...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-delete">이 글 삭제...</button></li>
			</ul>
			</li>
			<li class="menu-edit"><button id="menu-insert" popovertarget="menu-insertsub">삽입</button>
			<ul id="menu-insertsub" popover>
				<li><button class="menu-action" id="menu-insert-p">문단 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-section">&lt;section&gt; 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-article">&lt;article&gt; 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-fieldset">&lt;fieldset&gt; 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-legend">&lt;legend&gt; 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-columns">다단 레이아웃 삽입</button></li>
				<li><button class="menu-action" id="menu-insert-header">제목 삽입</button></li>
				<li><button class="menu-action" id="menu-delete-element">요소 삭제</button></li>
				<li><button class="menu-action" id="menu-stoptargeting">삽입/삭제 취소</button></li>
			</ul>
			</li>
		</menu>
	</header>
	<dialog id="dialog">
		<h6 id="dialog-title"></h6>
		<div id="dialog-main"></div>
		<div id="dialog-buttons">
			<button id="dialog-cancel" command="close" commandfor="dialog">취소</button>
			<button id="dialog-confirm">확인</button>
		</div>
	</dialog>
	###여기까지가 템플릿임###
</body>
</html>

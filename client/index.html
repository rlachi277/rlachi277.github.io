<!DOCTYPE html>
<html lang="ko">
<head>
	<title>cycweb post</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/client/colors.css">
	<link rel="stylesheet" href="/client/style.css">
	<script src="/client/script.js" type="module"></script>
</head>
<body>
	<header>
		<menu>
			<li><button id="menu-file" popovertarget="menu-filesub">파일</button>
			<ul id="menu-filesub" popover>
				<li><button class="menu-action" id="menu-export">JSON으로 저장</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-load">JSON에서 불러오기...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-new">새 글...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-duplicate">이 글 복제...</button></li>
				<li class="menu-edit"><button class="menu-action" id="menu-delete">이 글 삭제...</button></li>
			</ul>
			</li>
			<li class="menu-edit"><button id="menu-insert" popovertarget="menu-insertsub">삽입</button>
			<ul id="menu-insertsub" popover>
				<li><button class="menu-action" id="menu-inserttestp">삽입 테스트[문단]</button></li>
				<li><button class="menu-action" id="menu-inserttests">삽입 테스트[단락]</button></li>
				<li><button class="menu-action" id="menu-deletetest">삭제 테스트</button></li>
				<li><button class="menu-action" id="menu-stoptargeting">타게팅 종료</button></li>
			</ul>
			</li>
		</menu>
	</header>
	<dialog id="dialog">
		<h6 id="dialog-title"></h6>
		<div id="dialog-main"></div>
		<div id="dialog-buttons">
			<button id="dialog-cancel" command="close" commandfor="dialog">취소</button>
			<button id="dialog-confirm">확인</button>
		</div>
	</dialog>
	###여기까지가 템플릿임###
</body>
</html>
